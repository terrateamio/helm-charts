{{/*
Secrets created from any inline values the user supplied. Every value defaults to
"", in which case nothing is rendered here and the chart references a Secret the
user created out of band, exactly as it always has.
*/}}
{{- range $name, $data := (include "terrateam.managedSecrets" $ | fromYaml) }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $name }}
  namespace: {{ template "application.namespace" $ }}
  {{- with (mergeOverwrite (deepCopy $.Values.global.annotations) $.Values.terrateam.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "terrateam.labels" $ | nindent 4 }}
    {{- with (mergeOverwrite (deepCopy $.Values.global.labels) $.Values.terrateam.labels) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
